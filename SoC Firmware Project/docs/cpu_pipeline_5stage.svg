<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Helvetica, Arial, sans-serif">
  <title>RV32I five-stage pipeline</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b23a1f"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">RV32I five-stage in-order pipeline</text>

  <!-- stages -->
  <g font-size="15" font-weight="bold" fill="#222" text-anchor="middle">
    <rect x="30"  y="120" width="130" height="90" rx="8" fill="#eef3f8" stroke="#333"/>
    <text x="95"  y="150">Fetch</text>
    <rect x="220" y="120" width="130" height="90" rx="8" fill="#eef3f8" stroke="#333"/>
    <text x="285" y="150">Decode</text>
    <rect x="410" y="120" width="130" height="90" rx="8" fill="#eef3f8" stroke="#333"/>
    <text x="475" y="150">Execute</text>
    <rect x="600" y="120" width="130" height="90" rx="8" fill="#eef3f8" stroke="#333"/>
    <text x="665" y="150">Memory</text>
    <rect x="790" y="120" width="130" height="90" rx="8" fill="#eef3f8" stroke="#333"/>
    <text x="855" y="150">Writeback</text>
  </g>
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="95"  y="172">PC, BRAM port A</text>
    <text x="95"  y="188">fetch buffer</text>
    <text x="285" y="172">decode</text>
    <text x="285" y="188">register file read</text>
    <text x="475" y="172">ALU, forwarding</text>
    <text x="475" y="188">branch resolve</text>
    <text x="665" y="172">BRAM port B /</text>
    <text x="665" y="188">peripherals (Wishbone)</text>
    <text x="855" y="172">load extend</text>
    <text x="855" y="188">register write</text>
  </g>

  <!-- pipeline registers -->
  <g font-size="10.5" fill="#222" text-anchor="middle">
    <rect x="178" y="112" width="24" height="106" fill="#d9d9d9" stroke="#333"/>
    <text x="190" y="235">IF/ID</text>
    <rect x="368" y="112" width="24" height="106" fill="#d9d9d9" stroke="#333"/>
    <text x="380" y="235">ID/EX</text>
    <rect x="558" y="112" width="24" height="106" fill="#d9d9d9" stroke="#333"/>
    <text x="570" y="235">EX/MEM</text>
    <rect x="748" y="112" width="24" height="106" fill="#d9d9d9" stroke="#333"/>
    <text x="760" y="235">MEM/WB</text>
  </g>
  <g stroke="#333" stroke-width="1.5" marker-end="url(#a)">
    <line x1="160" y1="165" x2="176" y2="165"/>
    <line x1="202" y1="165" x2="218" y2="165"/>
    <line x1="350" y1="165" x2="366" y2="165"/>
    <line x1="392" y1="165" x2="408" y2="165"/>
    <line x1="540" y1="165" x2="556" y2="165"/>
    <line x1="582" y1="165" x2="598" y2="165"/>
    <line x1="730" y1="165" x2="746" y2="165"/>
    <line x1="772" y1="165" x2="788" y2="165"/>
  </g>

  <!-- forwarding paths -->
  <g fill="none" stroke="#1f6fb2" stroke-width="1.8" marker-end="url(#f)">
    <path d="M570,112 L570,88 L500,88 L500,118"/>
    <path d="M760,112 L760,70 L455,70 L455,118"/>
  </g>
  <g font-size="11" fill="#1f6fb2">
    <text x="600" y="62">forward MEM/WB to EX</text>
    <text x="590" y="84">EX/MEM to EX</text>
  </g>

  <!-- writeback to register file -->
  <path d="M855,210 L855,268 L285,268 L285,212" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="665" y="262" font-size="11" fill="#333" text-anchor="middle">write back to register file (write-through bypass in Decode)</text>

  <!-- branch redirect -->
  <path d="M475,210 L475,300 L95,300 L95,212" fill="none" stroke="#b23a1f" stroke-width="1.8" marker-end="url(#r)"/>
  <text x="285" y="318" font-size="11" fill="#b23a1f" text-anchor="middle">taken branch or jump: redirect PC, flush wrong path (4 cycles)</text>

  <!-- notes -->
  <g font-size="11.5" fill="#444">
    <text x="30" y="350">Load-use: the hazard unit compares the instruction in Decode with the load in ID/EX and inserts a bubble.</text>
    <text x="30" y="368">Every load holds the pipeline 1 cycle for the registered block RAM read. Fetch re-presents the last address while stalled.</text>
    <text x="30" y="386">32 KB true dual-port block RAM: port A for instructions, port B for data. 50 MHz on an Artix-7 XC7A100T.</text>
  </g>
</svg>
